name: Build APK

# Due modi d'uso:
# - manuale (Actions → Build APK → Run workflow): APK firmato scaricabile come artifact, nessuna release,
#   quindi nessun popup per i tester;
# - richiamato da release.yml con `tag`: allega l'APK alla release appena creata.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Tag della release a cui allegare l'APK
        type: string
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 mancante"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Expo prebuild
        run: npx expo prebuild -p android --clean --no-install

      - name: Build release APK
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_CUSAPP_UPLOAD_STORE_FILE: ${{ runner.temp }}/release.keystore
          ORG_GRADLE_PROJECT_CUSAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_CUSAPP_UPLOAD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_CUSAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Name APK
        id: apk
        run: |
          if [ -n "$TAG" ]; then
            name="CusCosenza-$TAG.apk"
          else
            name="CusCosenza-v$(node -p "require('./app.json').expo.version")-${GITHUB_SHA::7}.apk"
          fi
          cp android/app/build/outputs/apk/release/app-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload APK to release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          APK_NAME: ${{ steps.apk.outputs.name }}
        run: gh release upload "$TAG" "$APK_NAME" --clobber

      - name: Upload APK as artifact
        if: inputs.tag == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          retention-days: 7
          if-no-files-found: error

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
