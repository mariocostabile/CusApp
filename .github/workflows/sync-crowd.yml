name: Sync CUS Google Maps Crowd Data

on:
  schedule:
    # Runs at :15 past every hour from 08:00 to 20:00 UTC (10:00 to 22:00 Italian Time) Monday through Saturday
    - cron: '15 8-20 * * 1-6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-crowd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      # Exact version: this job holds a token that can push to master.
      - name: Install Puppeteer
        run: npm install puppeteer@25.16.0 --no-save

      - name: Run Crowd Sync Script
        run: node scripts/sync-google-crowd.js

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "CusApp Crowd Bot"
          git add crowd_live.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(crowd): sync live Google Maps crowd data [skip ci]" && git push)
